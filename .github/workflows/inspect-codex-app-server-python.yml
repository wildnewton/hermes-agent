name: Inspect current Codex streaming path with Python

on:
  push:
    branches:
      - experiment/delegate-codex-app-server-progress

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/delegate-codex-app-server-progress
          fetch-depth: 0

      - name: Build inspection report
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('agent'), Path('tools'), Path('hermes_cli'), Path('run_agent.py')]
          terms = [
              'CodexAppServerSession', 'codex_app_server', 'on_event',
              'stream_callback', 'interim_assistant_callback', 'acp_command',
              'commandExecution', 'agentMessage',
          ]

          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(p for p in root.rglob('*.py') if '__pycache__' not in p.parts)

          lines_out = ['# Codex app-server / delegation inspection', '']
          for term in terms:
              lines_out.append(f'## Matches for `{term}`')
              found = 0
              for path in sorted(files):
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except Exception:
                      continue
                  for idx, line in enumerate(lines):
                      if term not in line:
                          continue
                      found += 1
                      start = max(0, idx - 4)
                      end = min(len(lines), idx + 5)
                      lines_out.append(f'### {path}:{idx + 1}')
                      lines_out.append('```python')
                      for n in range(start, end):
                          lines_out.append(f'{n + 1:5d}: {lines[n]}')
                      lines_out.append('```')
              if not found:
                  lines_out.append('(none)')
              lines_out.append('')

          Path('codex-analysis.txt').write_text('\n'.join(lines_out), encoding='utf-8')
          PY

      - name: Commit report and remove one-shot workflow
        run: |
          rm .github/workflows/inspect-codex-app-server-python.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-analysis.txt .github/workflows/inspect-codex-app-server-python.yml
          git commit -m 'chore: expand Codex streaming path analysis'
          git push origin HEAD:experiment/delegate-codex-app-server-progress
