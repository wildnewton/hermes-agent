name: Prepare Codex merge branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prepare-codex-merge
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: merge/codex-delegate-progress-and-symlinks
          fetch-depth: 1
          show-progress: false

      - name: Apply Codex production commit
        shell: bash
        env:
          GIT_EDITOR: "true"
        run: |
          set -euo pipefail
          commit="04c9a50abdd406645a4cec6b23d666600ebd8d83"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --no-tags --depth=3000 origin \
            +refs/heads/fix/find-skill-follow-symlinks:refs/remotes/origin/fix/find-skill-follow-symlinks

          if git cherry-pick "${commit}"; then
            exit 0
          fi

          conflicted="$(git diff --name-only --diff-filter=U)"
          if [[ "${conflicted}" != "tools/delegate_tool.py" ]]; then
            echo "::error::Unexpected conflict set: ${conflicted}"
            git status --short
            exit 1
          fi

          git checkout --ours -- tools/delegate_tool.py

          python - <<'PY'
          from pathlib import Path
          import subprocess

          commit = "04c9a50abdd406645a4cec6b23d666600ebd8d83"
          path = Path("tools/delegate_tool.py")
          current = path.read_text(encoding="utf-8")
          source = subprocess.check_output(
              ["git", "show", f"{commit}:tools/delegate_tool.py"],
              text=True,
          )

          if "\nimport subprocess\n" not in current:
              marker = "import os\n"
              if marker not in current:
                  raise RuntimeError("Could not locate import insertion point")
              current = current.replace(marker, marker + "import subprocess\n", 1)

          helper_start = source.index("def _run_codex_exec(")
          helper_end = source.index("def _run_single_child(", helper_start)
          helper_block = source[helper_start:helper_end]
          if "def _run_codex_exec(" not in current:
              marker = "def _run_single_child("
              if marker not in current:
                  raise RuntimeError("Could not locate _run_single_child")
              current = current.replace(marker, helper_block + marker, 1)

          source_single = source.index("def _run_single_child(")
          fast_start = source.index("        # ── Codex exec fast path", source_single)
          fast_end = source.index("        # File-state coordination:", fast_start)
          fast_block = source[fast_start:fast_end]
          if "        # ── Codex exec fast path" not in current:
              marker = "        # File-state coordination:"
              if marker not in current:
                  raise RuntimeError("Could not locate fast-path insertion point")
              current = current.replace(marker, fast_block + marker, 1)

          path.write_text(current, encoding="utf-8")
          PY

          git add tools/delegate_tool.py
          git cherry-pick --continue

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused tests
        run: python -m pytest tests/tools/test_delegate.py tests/tools/test_skill_manager_tool.py

      - name: Remove temporary workflow and push prepared branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-codex-merge.yml
          git add -A
          git commit -m "chore: finish Codex merge preparation [prepared]"
          git push origin HEAD:merge/codex-delegate-progress-and-symlinks
