name: Prepare Codex merge branch

on:
  push:
    branches:
      - merge/codex-delegate-progress-and-symlinks

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cherry-pick source branch commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/find-skill-follow-symlinks
          base="$(git merge-base HEAD origin/fix/find-skill-follow-symlinks)"
          commits="$(git rev-list --reverse "${base}"..origin/fix/find-skill-follow-symlinks)"
          for commit in ${commits}; do
            if git cherry-pick "${commit}"; then
              continue
            fi
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Cherry-pick conflict in ${commit}"
              git status --short
              exit 1
            fi
            git cherry-pick --skip
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused tests
        run: python -m pytest tests/tools/test_delegate.py tests/tools/test_skill_manager_tool.py

      - name: Remove temporary workflow and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-codex-merge.yml
          git add -A
          git commit -m "chore: finish Codex merge preparation [prepared]"
          git push origin HEAD:merge/codex-delegate-progress-and-symlinks
