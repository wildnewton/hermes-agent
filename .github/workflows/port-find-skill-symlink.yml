name: Port find-skill symlink fix

on:
  push:
    branches:
      - fix/port-find-skill-follow-symlinks

permissions:
  contents: write

jobs:
  port-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/port-find-skill-follow-symlinks
          fetch-depth: 0

      - name: Port symlink-aware discovery and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('tools/skill_manager_tool.py')
          text = source.read_text(encoding='utf-8')

          old_import = 'from agent.skill_utils import get_all_skills_dirs, is_excluded_skill_path'
          new_import = (
              'from agent.skill_utils import ('
              'get_all_skills_dirs, is_excluded_skill_path, iter_skill_index_files'
              ')'
          )
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif 'iter_skill_index_files' not in text:
              raise SystemExit('Expected _find_skill import was not found')

          old_loop = 'for skill_md in skills_dir.rglob("SKILL.md"):'
          new_loop = 'for skill_md in iter_skill_index_files(skills_dir, "SKILL.md"):'
          if old_loop in text:
              text = text.replace(old_loop, new_loop, 1)
          elif new_loop not in text:
              raise SystemExit('Expected _find_skill rglob loop was not found')

          source.write_text(text, encoding='utf-8')

          tests = Path('tests/tools/test_skill_manager_tool.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'class TestFindSkillFollowsSymlinks:'
          if marker not in test_text:
              test_text += '''\n\nclass TestFindSkillFollowsSymlinks:\n    \"\"\"_find_skill must follow symlinks, matching skill_view discovery.\"\"\"\n\n    def test_finds_skill_via_symlinked_directory(self, tmp_path):\n        from tools.skill_manager_tool import _find_skill\n\n        skills = tmp_path / \"local-skills\"\n        skills.mkdir()\n        real_dir = tmp_path / \"real-skill\"\n        real_dir.mkdir()\n        (real_dir / \"SKILL.md\").write_text(\n            \"---\\nname: test-symlink\\ndescription: test\\n---\\n# Test\\n\",\n            encoding=\"utf-8\",\n        )\n        symlink = skills / \"test-symlink\"\n        symlink.symlink_to(real_dir, target_is_directory=True)\n\n        with patch(\n            \"agent.skill_utils.get_all_skills_dirs\",\n            return_value=[skills],\n        ):\n            found = _find_skill(\"test-symlink\")\n\n        assert found is not None\n        assert found[\"path\"] == symlink\n'''
              tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run skill-manager regression tests
        run: uv run pytest -q tests/tools/test_skill_manager_tool.py

      - name: Commit tested port and remove one-shot workflow
        run: |
          rm .github/workflows/port-find-skill-symlink.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/skill_manager_tool.py tests/tools/test_skill_manager_tool.py .github/workflows/port-find-skill-symlink.yml
          git commit -m 'fix(skills): follow symlinked skill directories'
          git push origin HEAD:fix/port-find-skill-follow-symlinks
