name: Inspect current Codex streaming path

on:
  push:
    branches:
      - experiment/delegate-codex-app-server-progress

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/delegate-codex-app-server-progress
          fetch-depth: 0

      - name: Build inspection report
        run: |
          {
            echo '# Codex app-server / delegation inspection'
            echo
            echo '## All relevant matches'
            rg -n --hidden --glob '!apps/**' --glob '!tests/**' \
              'CodexAppServerSession|codex_app_server|on_event|stream_callback|interim_assistant_callback|acp_command' \
              agent tools run_agent.py hermes_cli 2>/dev/null || true
            echo
            echo '## Delegate config and child construction'
            rg -n -C 5 'override_api_mode|override_acp_command|AIAgent\(' tools/delegate_tool.py || true
            echo
            echo '## Codex app-server construction sites'
            rg -n -C 8 'CodexAppServerSession\(' . --glob '!apps/**' --glob '!tests/**' || true
            echo
            echo '## Codex event forwarding sites'
            rg -n -C 8 '_on_codex|on_event|item/agentMessage|agentMessage|item/commandExecution|commandExecution' agent tools run_agent.py --glob '!apps/**' || true
            echo
            echo '## Conversation-loop codex special path'
            rg -n -C 12 'codex_app_server|run_turn\(' agent/conversation_loop.py run_agent.py agent/agent_init.py || true
          } > codex-analysis.txt

      - name: Commit report and remove one-shot workflow
        run: |
          rm .github/workflows/inspect-codex-app-server.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-analysis.txt .github/workflows/inspect-codex-app-server.yml
          git commit -m 'chore: capture Codex streaming path analysis'
          git push origin HEAD:experiment/delegate-codex-app-server-progress
