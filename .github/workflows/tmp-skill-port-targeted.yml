name: Temporary skill-port targeted validation

on:
  push:
    branches:
      - validation/skill-port-targeted-2026-08-27

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run targeted skill-manager regressions
        run: uv run pytest -q tests/tools/test_skill_manager_fork_regressions.py

      - name: Run existing skill-manager tests
        run: uv run pytest -q tests/tools/test_skill_manager_tool.py
